<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#FAF7F2;color:#2B2B2B;font-family:"Helvetica Neue",Arial,sans-serif}
.h{padding:32px 20px 4px;font-size:28px;font-weight:700}
.s{padding:0 20px;font-size:15px;color:#6a6a6a}
.field{margin:18px 20px 0;height:52px;border-radius:26px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 20px;color:#888}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;font-size:14px}
.sec{padding:12px 20px 10px;font-size:18px;font-weight:700}
.row{display:flex;gap:14px;padding:0 20px;overflow:hidden}
.card{width:220px;flex:none;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);overflow:hidden}
.ph{height:140px}
.card b{display:block;padding:12px 14px 2px;font-size:17px}
.card span{display:block;padding:0 14px 14px;font-size:13px;color:#7FB069;font-weight:700}
.cta{position:absolute;left:20px;right:20px;bottom:20px;height:56px;border-radius:28px;background:#E8743B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
</style></head><body>
<div class="h">What's in your kitchen?</div>
<div class="s">Add what you have, we'll find dishes.</div>
<div class="field">Add an ingredient</div>
<div class="chips"><div class="chip">Chicken</div><div class="chip">Garlic</div><div class="chip">Onion</div><div class="chip">Soy sauce</div><div class="chip">Rice</div><div class="chip">Eggs</div></div>
<div class="sec">You can cook now</div>
<div class="row">
<div class="card"><div class="ph" style="background:linear-gradient(135deg,#a77a1c,#e9c46a)"></div><b>Garlic Fried Rice</b><span>Ready · 15 min</span></div>
<div class="card"><div class="ph" style="background:linear-gradient(135deg,#8a2a16,#c0552f)"></div><b>Chicken Adobo</b><span>Missing 1 · 45 min</span></div>
</div>
<div class="cta">Find recipes (6)</div>
</body></html>
