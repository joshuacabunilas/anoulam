<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1F2937;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
.bar{height:64px;display:flex;align-items:center;padding:0 16px;font-size:22px;font-weight:500}
.field{margin:8px 16px;height:56px;border-radius:28px;background:#F3F4F6;display:flex;align-items:center;padding:0 20px;color:#6B7280}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid #D1D5DB;display:flex;align-items:center;font-size:14px}
.sec{padding:16px 16px 8px;font-size:16px;font-weight:500}
.card{margin:0 16px 12px;border-radius:12px;border:1px solid #E5E7EB;overflow:hidden}
.ph{height:150px}
.card b{display:block;padding:10px 12px 0;font-size:17px;font-weight:500}
.card span{display:block;padding:2px 12px 12px;font-size:13px;color:#16A34A}
.cta{position:absolute;left:16px;right:16px;bottom:16px;height:52px;border-radius:26px;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
</style></head><body>
<div class="bar">What to Cook</div>
<div class="field">Add an ingredient</div>
<div class="chips"><div class="chip">Chicken</div><div class="chip">Garlic</div><div class="chip">Onion</div><div class="chip">Soy sauce</div><div class="chip">Rice</div><div class="chip">Eggs</div></div>
<div class="sec">Suggested recipes</div>
<div class="card"><div class="ph" style="background:linear-gradient(135deg,#a77a1c,#e9c46a)"></div><b>Garlic Fried Rice</b><span>Ready to cook · 15 min</span></div>
<div class="card"><div class="ph" style="background:linear-gradient(135deg,#8a2a16,#c0552f)"></div><b>Chicken Adobo</b><span>Missing 1 · 45 min</span></div>
<div class="cta">Find recipes (6)</div>
</body></html>
