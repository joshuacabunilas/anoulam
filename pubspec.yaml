name: mobile
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  injectable: ^2.7.1+4
  dio: ^5.11.1
  json_annotation: ^4.9.0
  go_router: ^17.5.0
  fpdart: ^1.2.0
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/OFL-DMSans.txt

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# path_provider_android 2.3+ loads native code through package:jni, which
# fails to load on some devices ("Failed to load dynamic library
# libdartjni.so"). 2.2.x uses the older platform channel and has no jni.
# Remove once a fixed version is released.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"
# path_provider_foundation 2.5+ (iOS/macOS only) uses package:objective_c,
# whose build hook breaks build_runner ("'dart compile' does not support
# build hooks"). The app is Android-only; remove once build_runner copes.
  path_provider_foundation: ">=2.4.0 <2.5.0"
